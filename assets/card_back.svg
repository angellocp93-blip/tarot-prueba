<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 300 520" width="100%" height="100%">
  <defs>
    <radialGradient id="bg" cx="50%" cy="50%" r="70%">
      <stop offset="0%" stop-color="#1b1536"/>
      <stop offset="100%" stop-color="#0a0814"/>
    </radialGradient>
    <linearGradient id="gold" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#f8e79b"/>
      <stop offset="50%" stop-color="#d4af37"/>
      <stop offset="100%" stop-color="#9a7b1c"/>
    </linearGradient>
    <pattern id="stars" width="40" height="40" patternUnits="userSpaceOnUse">
      <circle cx="20" cy="20" r="1" fill="#d4af37" opacity="0.3"/>
      <circle cx="10" cy="10" r="0.5" fill="#f8e79b" opacity="0.2"/>
      <circle cx="30" cy="30" r="0.5" fill="#f8e79b" opacity="0.2"/>
    </pattern>
  </defs>

  <!-- Background -->
  <rect x="0" y="0" width="300" height="520" rx="16" fill="url(#bg)"/>
  <rect x="0" y="0" width="300" height="520" rx="16" fill="url(#stars)"/>

  <!-- Outer Borders -->
  <rect x="10" y="10" width="280" height="500" rx="12" fill="none" stroke="url(#gold)" stroke-width="2" opacity="0.9"/>
  <rect x="16" y="16" width="268" height="488" rx="8" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.5" stroke-dasharray="4,2"/>
  <rect x="22" y="22" width="256" height="476" rx="6" fill="none" stroke="url(#gold)" stroke-width="1.2" opacity="0.7"/>

  <!-- Corner Ornaments -->
  <g fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.8">
    <path d="M 26 40 L 40 40 L 40 26"/>
    <circle cx="44" cy="44" r="2" fill="url(#gold)"/>
    <path d="M 274 40 L 260 40 L 260 26"/>
    <circle cx="256" cy="44" r="2" fill="url(#gold)"/>
    <path d="M 26 480 L 40 480 L 40 494"/>
    <circle cx="44" cy="476" r="2" fill="url(#gold)"/>
    <path d="M 274 480 L 260 480 L 260 494"/>
    <circle cx="256" cy="476" r="2" fill="url(#gold)"/>
  </g>

  <!-- Central Mystical Mandalas -->
  <g transform="translate(150, 260)">
    <!-- Outer concentric circles -->
    <circle r="85" fill="none" stroke="url(#gold)" stroke-width="1" opacity="0.6"/>
    <circle r="80" fill="none" stroke="url(#gold)" stroke-width="0.7" stroke-dasharray="3,3" opacity="0.8"/>
    <circle r="65" fill="none" stroke="url(#gold)" stroke-width="1.5" opacity="0.7"/>
    <circle r="50" fill="none" stroke="url(#gold)" stroke-width="0.8" opacity="0.5"/>

    <!-- 8-Pointed Star -->
    <g stroke="url(#gold)" stroke-width="1.2" fill="none" opacity="0.85">
      <polygon points="0,-75 22,-22 75,0 22,22 0,75 -22,22 -75,0 -22,-22"/>
      <polygon points="0,-55 16,-16 55,0 16,16 0,55 -16,16 -55,0 -16,-16" stroke-width="0.8"/>
    </g>

    <!-- Celestial Moon and Sun Center -->
    <circle r="24" fill="#1b1536" stroke="url(#gold)" stroke-width="2"/>
    <circle r="20" fill="none" stroke="url(#gold)" stroke-width="0.8" stroke-dasharray="2,2"/>
    
    <!-- Sun Rays / Petals -->
    <g fill="url(#gold)" opacity="0.9">
      <circle cx="0" cy="0" r="8"/>
      <path d="M -12 -12 Q 0 -18 12 -12 Q 18 0 12 12 Q 0 18 -12 12 Q -18 0 -12 -12" fill="none" stroke="url(#gold)" stroke-width="1"/>
    </g>

    <!-- Diamond nodes -->
    <g fill="url(#gold)">
      <polygon points="0,-85 3,-80 0,-75 -3,-80"/>
      <polygon points="0,85 3,80 0,75 -3,80"/>
      <polygon points="-85,0 -80,3 -75,0 -80,-3"/>
      <polygon points="85,0 80,3 75,0 80,-3"/>
    </g>
  </g>

  <!-- Top / Bottom Crescent Moons -->
  <g fill="url(#gold)" opacity="0.75">
    <path d="M 142 65 A 15 15 0 0 0 158 65 A 12 12 0 0 1 142 65 Z"/>
    <circle cx="150" cy="78" r="2.5"/>
    <path d="M 142 455 A 15 15 0 0 1 158 455 A 12 12 0 0 0 142 455 Z"/>
    <circle cx="150" cy="442" r="2.5"/>
  </g>
</svg>

